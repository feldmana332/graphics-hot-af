// ── Chart drawing (pure fns, shared by live preview + GIF export) ───────────────
// pv = animation progress 0→1. bg: if set, paints a solid background (GIF export);
// if null, clears to transparent so the page's dark panel shows through (live view).
// Show at most `max` evenly-spaced category labels (always include the last) so dense
// data — many years, minutes, etc. — stays readable without dropping any data points.
function labelStep(n,max){return Math.max(1,Math.ceil(n/max));}

// Compact number formatting for axis ticks / value labels (1.1M, 214k, 9.05).
function fmtNum(v){
  const a=Math.abs(v);
  if(a>=1e9) return (v/1e9).toFixed(a>=1e10?0:1)+"B";
  if(a>=1e6) return (v/1e6).toFixed(a>=1e7?0:1)+"M";
  if(a>=1e3) return (v/1e3).toFixed(a>=1e4?0:1)+"k";
  if(Number.isInteger(v)) return String(v);
  return String(Math.round(v*100)/100);
}

// "Nice numbers" axis (Heckbert): pick a clean step (1/2/5 × 10^n) and round the
// bounds outward, so y-axis ticks land on round values (5.0, 5.5, 6.0 / 0, 10, 20)
// instead of arbitrary fractions like 5.37.
function niceNum(range,round){
  const exp=Math.floor(Math.log10(range||1)), f=(range||1)/Math.pow(10,exp);
  const nf=round?(f<1.5?1:f<3?2:f<7?5:10):(f<=1?1:f<=2?2:f<=5?5:10);
  return nf*Math.pow(10,exp);
}
function niceTicks(min,max,maxTicks){
  maxTicks=maxTicks||5;
  const range=niceNum((max-min)||Math.abs(max)||1,false);
  const step=niceNum(range/Math.max(1,maxTicks-1),true);
  const niceMin=Math.floor(min/step)*step, niceMax=Math.ceil(max/step)*step;
  const n=Math.round((niceMax-niceMin)/step), ticks=[];
  for(let i=0;i<=n;i++){let v=niceMin+i*step; if(Math.abs(v)<step*1e-6)v=0; ticks.push(v);}
  return {niceMin,niceMax,step,ticks};
}
// Format a tick at the step's natural precision (whole→compact, else fixed decimals).
function axisTickLabel(v,step){
  if(step>=1) return fmtNum(v);
  const dec=Math.max(0,Math.ceil(-Math.log10(step)));
  return v.toFixed(dec);
}

// Color palettes (series colors) and light/dark themes (background + ink).
const PALETTES={
  Default:COLORS,
  Ocean:["#38BDF8","#3B82F6","#14B8A6","#6366F1","#06B6D4","#2563EB","#0EA5E9","#8B5CF6","#22D3EE","#818CF8"],
  Warm:["#FB923C","#EF4444","#F59E0B","#F43F5E","#FBBF24","#DC2626","#F97316","#E11D48","#FCD34D","#FB7185"],
  Forest:["#22C55E","#84CC16","#10B981","#4D7C0F","#16A34A","#65A30D","#0D9488","#15803D","#A3E635","#34D399"],
  Mono:["#94A3B8","#64748B","#475569","#334155","#CBD5E1","#1E293B","#A8A29E","#78716C","#D6D3D1","#57534E"],
};
const THEME_DARK ={bg:"#212838",grid:"#2c3446",tick:"#666",axisLabel:"#888",axisTitle:"#aaa",title:"#fff",value:"#fff",pct:"#fff",legend:"#bbb",source:"#666"};
const THEME_LIGHT={bg:"#ffffff",grid:"#e5e5ea",tick:"#888",axisLabel:"#555",axisTitle:"#444",title:"#111",value:"#222",pct:"#fff",legend:"#333",source:"#888"};
function themeOf(opts){return opts&&opts.theme==="light"?THEME_LIGHT:THEME_DARK;}
function paletteOf(opts){return (opts&&opts.colors)||COLORS;}

// Pie/donut: keep the `maxN` largest slices (original order) and roll the rest into a
// single "Other" slice. maxN of 0/null (or fewer rows than the cap) means "show all".
function limitSlices(data,maxN){
  if(!maxN||!data||data.length<=maxN) return data||[];
  const rank=data.map((d,i)=>i).sort((x,y)=>Math.abs(data[y].value)-Math.abs(data[x].value));
  const keep=new Set(rank.slice(0,maxN-1));
  const top=data.filter((d,i)=>keep.has(i));
  const otherVal=data.reduce((s,d,i)=>keep.has(i)?s:s+Math.abs(d.value),0);
  return [...top,{label:"Other",value:otherVal}];
}

// ── Multi-series data model ─────────────────────────────────────────────────────
// A dataset = {series:[names], rows:[{label, values:[n,...]}]}. Each row also keeps
// `value` = values[0] so every single-series code path keeps working unchanged.
// Multi-series rendering kicks in only when series.length > 1.
function valsOf(row){ return (row.values&&row.values.length) ? row.values : [row.value]; }
function isMulti(seriesNames){ return Array.isArray(seriesNames) && seriesNames.length>1; }
// Normalize any incoming rows (string or numeric values) into the canonical model.
function buildDataset(seriesNames,rows){
  const names=(seriesNames&&seriesNames.length)?seriesNames.map(s=>String(s)):["Value"];
  const norm=(rows||[]).map(r=>{
    let vals=(r.values&&r.values.length)?r.values.slice():[r.value];
    vals=names.map((_,k)=>Number(vals[k]));           // coerce + align to column count
    return {label:String(r.label==null?"":r.label), value:vals[0], values:vals};
  });
  return {series:names, rows:norm};
}
// Serialize to multi-column CSV (Label,S1,S2,...). Tolerates string cell values.
function rowsToCSV(seriesNames,rows){
  const names=(seriesNames&&seriesNames.length)?seriesNames:["Value"];
  const header=["Label",...names].join(",");
  const lines=(rows||[]).map(r=>{const v=r.values&&r.values.length?r.values:[r.value];return [r.label,...names.map((_,k)=>v[k]!=null?v[k]:"")].join(",");});
  return [header,...lines].join("\n");
}
// Sort rows by their first series value (for bar charts). "desc" | "asc" | anything else = keep order.
function sortRows(rows,mode){
  if(mode!=="desc"&&mode!=="asc"||!rows) return rows;
  const f=r=>Number(valsOf(r)[0])||0;
  return [...rows].sort((a,b)=>mode==="desc"?f(b)-f(a):f(a)-f(b));
}

// Axis range/ticks honoring include-zero and manual min/max overrides.
function buildAxis(dataMin,dataMax,opts){
  opts=opts||{};
  const maxTicks=opts.maxTicks||5;
  const lo=opts.includeZero?Math.min(0,dataMin):dataMin, hi=opts.includeZero?Math.max(0,dataMax):dataMax;
  const hasMin=opts.yMin!=null&&opts.yMin!==""&&!isNaN(Number(opts.yMin));
  const hasMax=opts.yMax!=null&&opts.yMax!==""&&!isNaN(Number(opts.yMax));
  if(!hasMin&&!hasMax) return niceTicks(lo,hi,maxTicks);
  const auto=niceTicks(lo,hi,maxTicks);
  let min=hasMin?Number(opts.yMin):auto.niceMin, max=hasMax?Number(opts.yMax):auto.niceMax;
  if(max<=min) max=min+(auto.step||1);
  const step=niceNum((max-min)/Math.max(1,maxTicks-1),true), ticks=[min];
  for(let v=Math.ceil(min/step)*step; v<max-step*1e-6; v+=step){const vv=Math.abs(v)<step*1e-6?0:v; if(vv>min+step*1e-6)ticks.push(vv);}
  ticks.push(max);
  return {niceMin:min,niceMax:max,step,ticks};
}

// Draw optional rotated y-axis title and centered x-axis title.
function drawAxisTitles(ctx,padL,plotW,padT,plotH,H,xLab,yLab,color){
  ctx.fillStyle=color||"#999";ctx.font="bold 9px monospace";
  if(xLab){ctx.textAlign="center";ctx.textBaseline="alphabetic";ctx.fillText(xLab,padL+plotW/2,H-3);}
  if(yLab){ctx.save();ctx.translate(11,padT+plotH/2);ctx.rotate(-Math.PI/2);ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(yLab,0,0);ctx.restore();}
}

function drawPie(ctx,W,H,data,pv,donut,bg,opts){
  const th=themeOf(opts), colors=paletteOf(opts), sep=bg||th.bg;
  const mode=(opts&&opts.pieLabels)||"percent";   // percent | value | both | none
  const showName=!!(opts&&opts.pieName);           // also draw the category name on the slice
  const total=data.reduce((s,d)=>s+Math.abs(d.value),0)||1;
  const cx=W/2,cy=H/2,r=Math.min(W,H)*0.38,inner=donut?r*0.52:0;
  if(bg){ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);}else ctx.clearRect(0,0,W,H);
  let a=-Math.PI/2;const sl=[];
  data.forEach((item,i)=>{
    const sw=(Math.abs(item.value)/total)*2*Math.PI*pv,end=a+sw;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a,end);
    if(donut)ctx.arc(cx,cy,inner,end,a,true);else ctx.lineTo(cx,cy);
    ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.strokeStyle=sep;ctx.lineWidth=2;ctx.stroke();
    sl.push({mid:a+sw/2,sw,pct:((Math.abs(item.value)/total)*100).toFixed(1),val:Math.abs(item.value),label:item.label});a=end;
  });
  if((showName||mode!=="none")&&pv>0.85){const al=Math.min(1,(pv-0.85)/0.15);
    sl.forEach(({mid,sw,pct,val,label})=>{if(sw<0.18)return;
      const lines=[];
      if(showName) lines.push((label&&label.length>11)?label.slice(0,10)+"…":(label||""));
      if(mode==="percent") lines.push(pct+"%");
      else if(mode==="value") lines.push(fmtNum(val));
      else if(mode==="both"){ lines.push(fmtNum(val)); lines.push(pct+"%"); }
      if(!lines.length) return;
      const n=lines.length, f=Math.max(7, r*(n>=3?0.062:n===2?0.072:0.09)), lh=f*1.18;
      const lr=donut?(r+inner)/2:r*0.68, px=cx+Math.cos(mid)*lr, py=cy+Math.sin(mid)*lr;
      ctx.globalAlpha=al;ctx.fillStyle=th.pct;ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.font=`bold ${f}px monospace`;
      lines.forEach((t,i)=>ctx.fillText(t,px,py+(i-(n-1)/2)*lh));
      ctx.globalAlpha=1;
    });
  }
}

function drawBar(ctx,W,H,data,pv,bg,opts){
  opts=opts||{};
  const th=themeOf(opts), colors=paletteOf(opts);
  const multi=isMulti(opts.series), sc=multi?opts.series.length:1;
  const horiz=opts.orient==="horizontal";
  const bySign=opts.barColor==="sign"&&!multi;       // green positive / red negative
  const POS="#26A17B", NEG="#E84142";
  const xLab=opts.xLabel&&opts.xLabel.trim(), yLab=opts.yLabel&&opts.yLabel.trim();
  // Span the real value range incl. negatives, always keeping 0 on the axis (diverging).
  let dmin=0,dmax=0;
  data.forEach(d=>valsOf(d).forEach(v=>{const n=Number(v)||0;if(n<dmin)dmin=n;if(n>dmax)dmax=n;}));
  const {niceMin,niceMax,step,ticks}=buildAxis(dmin,dmax,{includeZero:true,maxTicks:opts.maxTicks,yMin:opts.yMin,yMax:opts.yMax}), denom=(niceMax-niceMin)||1;
  if(bg){ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);}else ctx.clearRect(0,0,W,H);
  const colorAt=(v,s,i)=>bySign?((Number(v)||0)<0?NEG:POS):(multi?colors[s%colors.length]:colors[i%colors.length]);
  const trunc=(s,n)=>{s=String(s==null?"":s);return s.length>n?s.slice(0,n-1)+"…":s;};
  if(horiz){
    const padT=12, padB=26+(xLab?16:0), padR=16;
    const maxLabel=Math.max(0,...data.map(d=>String(d.label||"").length));
    const padL=Math.max(56,Math.min(150,18+maxLabel*6));
    const plotW=W-padL-padR, plotH=H-padT-padB;
    const vAt=v=>padL+((Number(v)||0)-niceMin)/denom*plotW, x0=vAt(0);
    ctx.textBaseline="alphabetic";ctx.textAlign="center";
    ticks.forEach(v=>{const x=vAt(v);ctx.strokeStyle=th.grid;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,padT);ctx.lineTo(x,padT+plotH);ctx.stroke();ctx.font="8px monospace";ctx.fillStyle=th.tick;ctx.fillText(axisTickLabel(v,step),x,padT+plotH+12);});
    const gap=plotH/data.length, lstep=labelStep(data.length,20);
    const showValues=!multi&&(opts.valueLabels==="on"?true:opts.valueLabels==="off"?false:data.length<=16);
    data.forEach((item,i)=>{
      const vals=valsOf(item), band=padT+i*gap;
      if(multi){
        const clusterH=gap*0.82, sbh=clusterH/sc, y0c=band+(gap-clusterH)/2;
        vals.forEach((vv,s)=>{const xe=vAt((Number(vv)||0)*pv),x=Math.min(x0,xe),w=Math.abs(xe-x0),y=y0c+s*sbh;ctx.fillStyle=colorAt(vv,s,i);ctx.beginPath();ctx.roundRect(x,y,Math.max(0,w),Math.max(1,sbh-1.5),3);ctx.fill();});
      }else{
        const v=Number(item.value)||0, bh=gap*0.62, y=band+(gap-bh)/2, xe=vAt(v*pv), x=Math.min(x0,xe), w=Math.abs(xe-x0);
        const c=colorAt(v,0,i), g=ctx.createLinearGradient(x0,0,xe,0);g.addColorStop(0,c);g.addColorStop(1,c+"55");
        ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x,y,Math.max(0,w),bh,v<0?[4,0,0,4]:[0,4,4,0]);ctx.fill();
        if(showValues&&pv>0.85){ctx.globalAlpha=Math.min(1,(pv-0.85)/0.15);ctx.font="bold 9px monospace";ctx.fillStyle=th.value;ctx.textBaseline="middle";ctx.textAlign=v<0?"right":"left";ctx.fillText(fmtNum(v),xe+(v<0?-4:4),y+bh/2);ctx.globalAlpha=1;ctx.textBaseline="alphabetic";}
      }
      if(i%lstep===0||i===data.length-1){ctx.font="9px monospace";ctx.fillStyle=th.axisLabel;ctx.textAlign="right";ctx.textBaseline="middle";ctx.fillText(trunc(item.label,Math.floor(padL/6)),padL-6,band+gap/2);ctx.textBaseline="alphabetic";}
    });
    drawAxisTitles(ctx,padL,plotW,padT,plotH,H,xLab,"",th.axisTitle);
  }else{
    const padT=14, padB=34+(xLab?16:0), padL=42+(yLab?14:0), padR=14;
    const plotW=W-padL-padR, plotH=H-padT-padB, gap=plotW/data.length;
    const vAt=v=>padT+(1-((Number(v)||0)-niceMin)/denom)*plotH, y0=vAt(0), baseY=padT+plotH;
    ctx.textBaseline="middle";
    ticks.forEach(v=>{const y=vAt(v);ctx.strokeStyle=th.grid;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke();ctx.font="8px monospace";ctx.fillStyle=th.tick;ctx.textAlign="right";ctx.fillText(axisTickLabel(v,step),padL-5,y);});
    ctx.textBaseline="alphabetic";
    const lstep=labelStep(data.length,10);
    const showValues=!multi&&(opts.valueLabels==="on"?true:opts.valueLabels==="off"?false:data.length<=12);
    const xlabel=(item,cx)=>{ctx.font="9px monospace";ctx.fillStyle=th.axisLabel;ctx.textAlign="center";ctx.fillText(trunc(item.label,9),cx,baseY+12);};
    if(multi){
      const clusterW=gap*0.82, sbw=clusterW/sc;
      data.forEach((item,i)=>{const vals=valsOf(item),cx0=padL+i*gap+(gap-clusterW)/2;
        vals.forEach((vv,s)=>{const ye=vAt((Number(vv)||0)*pv),y=Math.min(y0,ye),h=Math.abs(ye-y0),x=cx0+s*sbw;ctx.fillStyle=colorAt(vv,s,i);ctx.beginPath();ctx.roundRect(x,y,Math.max(1,sbw-1.5),Math.max(0,h),3);ctx.fill();});
        if(i%lstep===0||i===data.length-1)xlabel(item,padL+i*gap+gap/2);});
    }else{
      const bw=gap*0.6;
      data.forEach((item,i)=>{const v=Number(item.value)||0,x=padL+i*gap+(gap-bw)/2,ye=vAt(v*pv),y=Math.min(y0,ye),h=Math.abs(ye-y0);
        const c=colorAt(v,0,i),g=ctx.createLinearGradient(0,y0,0,ye);g.addColorStop(0,c);g.addColorStop(1,c+"55");
        ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x,y,bw,Math.max(0,h),v<0?[0,0,4,4]:[4,4,0,0]);ctx.fill();
        if(i%lstep===0||i===data.length-1)xlabel(item,x+bw/2);
        if(showValues&&pv>0.85){ctx.globalAlpha=Math.min(1,(pv-0.85)/0.15);ctx.font="bold 10px monospace";ctx.fillStyle=th.value;ctx.textAlign="center";ctx.textBaseline=v<0?"top":"alphabetic";ctx.fillText(fmtNum(v),x+bw/2,ye+(v<0?4:-5));ctx.globalAlpha=1;ctx.textBaseline="alphabetic";}});
    }
    drawAxisTitles(ctx,padL,plotW,padT,plotH,H,xLab,yLab,th.axisTitle);
  }
}

// Catmull-Rom → cubic bezier through pts (current point already at pts[0]).
function curveThrough(ctx,pts){
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    ctx.bezierCurveTo(p1.x+(p2.x-p0.x)/6,p1.y+(p2.y-p0.y)/6,p2.x-(p3.x-p1.x)/6,p2.y-(p3.y-p1.y)/6,p2.x,p2.y);
  }
}
function drawLine(ctx,W,H,data,pv,bg,opts){
  opts=opts||{};
  const th=themeOf(opts), palette=paletteOf(opts), smooth=!!opts.smooth, sep=bg||th.bg;
  const multi=isMulti(opts.series), sc=multi?opts.series.length:1;
  const xLab=opts.xLabel&&opts.xLabel.trim(), yLab=opts.yLabel&&opts.yLabel.trim();
  let maxV=-Infinity,minV=Infinity;
  data.forEach(d=>valsOf(d).forEach(v=>{const n=Number(v)||0;if(n>maxV)maxV=n;if(n<minV)minV=n;}));
  if(!isFinite(maxV)){maxV=1;minV=0;}
  const {niceMin,niceMax,step,ticks}=buildAxis(minV,maxV,opts), denom=(niceMax-niceMin)||1;
  const padT=14, padB=32+(xLab?16:0), padL=44+(yLab?14:0), padR=14;
  const plotW=W-padL-padR, plotH=H-padT-padB, baseY=H-padB;
  const xAt=i=>padL+(i/Math.max(data.length-1,1))*plotW;
  const yAt=v=>padT+(1-(Number(v||0)-niceMin)/denom)*plotH;
  const vis=Math.max(2,Math.ceil(data.length*pv));
  if(bg){ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);}else ctx.clearRect(0,0,W,H);
  ctx.textBaseline="middle";
  ticks.forEach(v=>{const y=yAt(v);ctx.strokeStyle=th.grid;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke();ctx.font="8px monospace";ctx.fillStyle=th.tick;ctx.textAlign="right";ctx.fillText(axisTickLabel(v,step),padL-5,y);});
  const lstep=labelStep(data.length,10);
  // Optional vertical gridlines, aligned with the (thinned) x-axis labels.
  if(opts.vGrid){ctx.strokeStyle=th.grid;ctx.lineWidth=1;
    data.forEach((d,i)=>{if(i%lstep===0||i===data.length-1){const x=xAt(i);ctx.beginPath();ctx.moveTo(x,padT);ctx.lineTo(x,baseY);ctx.stroke();}});}
  ctx.textBaseline="alphabetic";
  // One line per series; in single-series mode this is identical to before (with area fill).
  for(let s=0;s<sc;s++){
    const lc=palette[s%palette.length];
    const pts=data.map((d,i)=>({x:xAt(i),y:yAt(valsOf(d)[s]),val:Number(valsOf(d)[s])||0}));
    const vpts=pts.slice(0,vis);
    if(vpts.length<2)continue;
    if(!multi){
      const g=ctx.createLinearGradient(0,padT,0,baseY);g.addColorStop(0,lc+"44");g.addColorStop(1,lc+"00");
      ctx.beginPath();ctx.moveTo(vpts[0].x,baseY);ctx.lineTo(vpts[0].x,vpts[0].y);
      if(smooth)curveThrough(ctx,vpts);else vpts.forEach((q,i)=>i&&ctx.lineTo(q.x,q.y));
      ctx.lineTo(vpts[vpts.length-1].x,baseY);ctx.closePath();ctx.fillStyle=g;ctx.fill();
    }
    ctx.beginPath();ctx.moveTo(vpts[0].x,vpts[0].y);
    if(smooth)curveThrough(ctx,vpts);else vpts.forEach((q,i)=>i&&ctx.lineTo(q.x,q.y));
    ctx.strokeStyle=lc;ctx.lineWidth=2.5;ctx.lineJoin="round";ctx.stroke();
    const showVals=!multi&&opts.valueLabels==="on";
    vpts.forEach((q,i)=>{ctx.beginPath();ctx.arc(q.x,q.y,3,0,Math.PI*2);ctx.fillStyle=lc;ctx.fill();ctx.strokeStyle=sep;ctx.lineWidth=1.5;ctx.stroke();
      if(showVals&&(i%lstep===0||i===data.length-1)){ctx.font="bold 9px monospace";ctx.fillStyle=th.value;ctx.textAlign="center";ctx.fillText(fmtNum(q.val),q.x,q.y-7);}
    });
  }
  // x-axis category labels (drawn once, thinned)
  if(vis>=2){ctx.font="8px monospace";ctx.fillStyle=th.axisLabel;ctx.textAlign="center";
    data.slice(0,vis).forEach((d,i)=>{if(i%lstep===0||i===data.length-1)ctx.fillText(d.label,xAt(i),baseY+12);});}
  drawAxisTitles(ctx,padL,plotW,padT,plotH,H,xLab,yLab,th.axisTitle);
}

const CHART_DIMS={Pie:{w:320,h:320},Donut:{w:320,h:320},Bar:{w:480,h:280},Line:{w:480,h:280}};
const CHART_STEP={Pie:0.007,Donut:0.007,Bar:0.01,Line:0.012};
// Explicit chart-area sizes for export/preview. "Auto" keeps the per-type default;
// the rest force a fixed aspect ratio (slides, square posts, vertical stories).
const ASPECTS={Auto:null,"1:1":{w:400,h:400},"4:3":{w:480,h:360},"16:9":{w:512,h:288},"9:16":{w:360,h:600}};
function chartDims(type,aspect){return (aspect&&ASPECTS[aspect])||CHART_DIMS[type]||CHART_DIMS.Bar;}
// Build a rounded-rect path on contexts that lack the native roundRect (e.g. the SVG
// recorder). radii: [topLeft, topRight, bottomRight, bottomLeft].
function ensureRoundRect(ctx){
  if(typeof ctx.roundRect==="function") return;
  ctx.roundRect=function(x,y,w,h,r){
    let tl,tr,br,bl;
    if(Array.isArray(r)){tl=r[0]||0;tr=r[1]!=null?r[1]:tl;br=r[2]!=null?r[2]:tl;bl=r[3]!=null?r[3]:tr;}
    else {tl=tr=br=bl=r||0;}
    this.moveTo(x+tl,y);this.lineTo(x+w-tr,y);this.quadraticCurveTo(x+w,y,x+w,y+tr);
    this.lineTo(x+w,y+h-br);this.quadraticCurveTo(x+w,y+h,x+w-br,y+h);
    this.lineTo(x+bl,y+h);this.quadraticCurveTo(x,y+h,x,y+h-bl);
    this.lineTo(x,y+tl);this.quadraticCurveTo(x,y,x+tl,y);
    return this;
  };
}
// Inject a CDN script once; resolves when loaded (used for the on-demand SVG encoder).
function loadScriptOnce(src){
  return new Promise((resolve,reject)=>{
    if([...document.scripts].some(s=>s.src===src)) return resolve();
    const el=document.createElement("script");el.src=src;
    el.onload=()=>resolve();el.onerror=()=>reject(new Error("script load failed"));
    document.head.appendChild(el);
  });
}
// Easing curves applied to the 0→1 build-up progress (live preview + GIF frames).
const EASINGS={
  Linear:t=>t,
  "Ease out":t=>1-Math.pow(1-t,3),
  "Ease in":t=>t*t*t,
  "Ease in-out":t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
};
function easeOf(name){return EASINGS[name]||EASINGS.Linear;}

function drawChart(type,ctx,W,H,data,pv,bg,opts){
  if(type==="Pie")drawPie(ctx,W,H,data,pv,false,bg,opts);
  else if(type==="Donut")drawPie(ctx,W,H,data,pv,true,bg,opts);
  else if(type==="Line")drawLine(ctx,W,H,data,pv,bg,opts);
  else drawBar(ctx,W,H,data,pv,bg,opts);
}

// ── Live chart components ───────────────────────────────────────────────────────
function useChartAnim(type,data,animKey,opts){
  const ref=useRef(),anim=useRef(),p=useRef(0);
  const optsKey=JSON.stringify(opts||{});
  // Light theme needs a solid canvas fill; dark theme stays transparent over the card.
  const liveBg=()=>opts&&opts.theme==="light"?THEME_LIGHT.bg:null;
  useEffect(()=>{p.current=0;cancelAnimationFrame(anim.current);
    const step=(CHART_STEP[type]||0.01)*((opts&&opts.speed)||1);   // larger step = faster build-up
    const ease=easeOf(opts&&opts.easing);
    const go=()=>{p.current=Math.min(1,p.current+step);const c=ref.current;
      if(c)drawChart(type,c.getContext("2d"),c.width,c.height,data,ease(p.current),liveBg(),opts);
      if(p.current<1)anim.current=requestAnimationFrame(go);};
    anim.current=requestAnimationFrame(go);return()=>cancelAnimationFrame(anim.current);
  },[animKey,data,type]);
  // Redraw the final frame (no replay) when formatting is edited.
  useEffect(()=>{const c=ref.current;if(c&&p.current>=1)drawChart(type,c.getContext("2d"),c.width,c.height,data,1,liveBg(),opts);},[optsKey]);
  return ref;
}

function AnimatedPieChart({data,donut=false,animKey,opts,w=320,h=320}){
  const ref=useChartAnim(donut?"Donut":"Pie",data,animKey,opts);
  return <canvas ref={ref} width={w} height={h} style={{width:"100%",maxWidth:w}}/>;
}

function AnimatedBarChart({data,animKey,opts,w=480,h=280}){
  const ref=useChartAnim("Bar",data,animKey,opts);
  return <canvas ref={ref} width={w} height={h} style={{width:"100%",maxWidth:w}}/>;
}

function AnimatedLineChart({data,animKey,opts,w=480,h=280}){
  const ref=useChartAnim("Line",data,animKey,opts);
  return <canvas ref={ref} width={w} height={h} style={{width:"100%",maxWidth:w}}/>;
}

// ── Export composition (shared by GIF + PNG) ────────────────────────────────────
// Geometry + resolved theme/palette/title for an exported chart.
function chartLayout(chartData,chartType,fmt){
  fmt=fmt||{};
  const th=themeOf(fmt), colors=PALETTES[fmt.palette]||COLORS;
  const title=(fmt.title!=null?fmt.title:chartData.title)||"Chart";
  const isPie=chartType==="Pie"||chartType==="Donut";
  const multi=isMulti(fmt.series)&&(chartType==="Line"||chartType==="Bar");
  const plotData=isPie?limitSlices(chartData.data,fmt.maxSlices):(chartType==="Bar"?sortRows(chartData.data,fmt.barSort):chartData.data);
  const axisOpts={xLabel:fmt.xLabel,yLabel:fmt.yLabel,includeZero:fmt.includeZero,maxTicks:fmt.maxTicks,
    valueLabels:fmt.valueLabels,smooth:fmt.smooth,vGrid:fmt.vGrid,yMin:fmt.yMin,yMax:fmt.yMax,theme:fmt.theme,colors,pieLabels:fmt.pieLabels,pieName:fmt.pieName,series:fmt.series,orient:fmt.orient,barColor:fmt.barColor};
  const cd=chartDims(chartType,fmt.aspect), titleH=46;
  // Multi-series → legend of series names; pie/donut → legend of category names.
  const legend=multi?fmt.series.map(n=>({label:n})):((isPie&&plotData.length<=40)?plotData:null);
  const legendH=legend?Math.ceil(legend.length/3)*20+12:0;
  const srcText=chartData.source&&chartData.source.name?("Source: "+chartData.source.name):null;
  const sourceH=srcText?22:0;
  return {th,colors,title,axisOpts,cd,titleH,legend,legendH,plotData,srcText,W:cd.w,H:titleH+cd.h+legendH+sourceH+10};
}
// Paint one full frame (bg + title + chart + legend + source) onto ctx at progress pv.
function composeChart(ctx,L,chartData,chartType,pv){
  const {th,colors,title,axisOpts,cd,titleH,legend,legendH,plotData,W,H,srcText}=L;
  ctx.fillStyle=th.bg;ctx.fillRect(0,0,W,H);
  ctx.fillStyle=th.title;ctx.font="bold 16px monospace";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(title.length>52?title.slice(0,51)+"…":title,W/2,titleH/2);
  ctx.save();ctx.translate(0,titleH);drawChart(chartType,ctx,cd.w,cd.h,plotData,pv,th.bg,axisOpts);ctx.restore();
  if(legend){
    ctx.textBaseline="middle";ctx.textAlign="left";ctx.font="11px monospace";
    const colW=W/3,baseY=titleH+cd.h+12;
    legend.forEach((d,i)=>{const x=(i%3)*colW+12,y=baseY+Math.floor(i/3)*20;
      ctx.fillStyle=colors[i%colors.length];ctx.fillRect(x,y-4,9,9);
      ctx.fillStyle=th.legend;ctx.fillText(d.label.length>16?d.label.slice(0,15)+"…":d.label,x+14,y);});
  }
  if(srcText){ctx.textAlign="left";ctx.textBaseline="middle";ctx.font="italic 11px monospace";ctx.fillStyle=th.source;
    ctx.fillText(srcText.length>64?srcText.slice(0,63)+"…":srcText,12,titleH+cd.h+legendH+12);}
}

// Animated GIF — encodes the build-up via gif.js.
async function exportChartGif(chartData,chartType,onProgress,fmt,scale){
  const L=chartLayout(chartData,chartType,fmt), S=Math.min(scale||2,2);   // cap GIF scale to keep file size sane
  const canvas=document.createElement("canvas");canvas.width=L.W*S;canvas.height=L.H*S;
  const ctx=canvas.getContext("2d");ctx.scale(S,S);
  // Web Workers can't load cross-origin scripts directly, so fetch the worker and
  // hand gif.js a same-origin blob URL instead.
  let workerScript;
  try{
    const txt=await fetch("https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js").then(r=>r.text());
    workerScript=URL.createObjectURL(new Blob([txt],{type:"application/javascript"}));
  }catch(e){throw new Error("Couldn't load the GIF encoder — needs internet the first time.");}
  const loop=!fmt||fmt.loop!==false;                          // default: loop forever
  const holdMs=fmt&&fmt.hold!=null?fmt.hold:2000;             // pause on the finished frame
  const frameDelay=Math.max(20,Math.round(55/((fmt&&fmt.speed)||1)));
  const ease=easeOf(fmt&&fmt.easing);
  const gif=new window.GIF({workers:2,quality:8,width:L.W*S,height:L.H*S,workerScript,repeat:loop?0:-1});
  const N=40;
  for(let i=0;i<=N;i++){composeChart(ctx,L,chartData,chartType,ease(i/N));gif.addFrame(ctx,{copy:true,delay:i===N?holdMs:frameDelay});}
  return await new Promise((resolve,reject)=>{
    gif.on("progress",p=>onProgress&&onProgress(Math.round(p*100)));
    gif.on("finished",blob=>{URL.revokeObjectURL(workerScript);resolve(blob);});
    gif.on("abort",()=>reject(new Error("GIF render aborted.")));
    gif.render();
  });
}

// Static high-res PNG of the finished chart. scale = pixel multiplier (default 3×).
async function exportChartPng(chartData,chartType,fmt,scale){
  const L=chartLayout(chartData,chartType,fmt), S=scale||3;
  const canvas=document.createElement("canvas");canvas.width=L.W*S;canvas.height=L.H*S;
  const ctx=canvas.getContext("2d");ctx.scale(S,S);
  composeChart(ctx,L,chartData,chartType,1);
  return await new Promise((resolve,reject)=>{canvas.toBlob(b=>b?resolve(b):reject(new Error("PNG export failed.")),"image/png");});
}

// Vector SVG of the finished chart. Reuses the canvas drawing via canvas2svg, which
// records the same 2D-context calls into an SVG document (lazy-loaded on first use).
async function exportChartSvg(chartData,chartType,fmt){
  if(!window.C2S){
    try{ await loadScriptOnce("https://unpkg.com/canvas2svg@1.0.19/canvas2svg.js"); }catch(e){}
  }
  if(!window.C2S) throw new Error("Couldn't load the SVG exporter — needs internet the first time.");
  const L=chartLayout(chartData,chartType,fmt);
  const ctx=new window.C2S(L.W,L.H);
  ensureRoundRect(ctx);
  composeChart(ctx,L,chartData,chartType,1);
  const svg=ctx.getSerializedSvg(true);
  return new Blob([svg],{type:"image/svg+xml"});
}

// Copy the finished chart to the clipboard as a PNG image. The ClipboardItem is fed a
// Promise<Blob> so Safari accepts it from within the click gesture.
async function copyChartToClipboard(chartData,chartType,fmt,scale){
  if(!navigator.clipboard||!window.ClipboardItem) throw new Error("Clipboard image copy isn't supported in this browser.");
  const item=new window.ClipboardItem({"image/png":exportChartPng(chartData,chartType,fmt,scale)});
  await navigator.clipboard.write([item]);
}

function Legend({data,colors}){
  const pal=colors||COLORS;
  return <div style={{display:"flex",flexWrap:"wrap",gap:"6px 12px",marginTop:12,justifyContent:"center"}}>
    {data.map((d,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:5,fontSize:10,color:"#aaa",fontFamily:"monospace"}}>
      <div style={{width:8,height:8,borderRadius:2,background:pal[i%pal.length],flexShrink:0}}/>{d.label}
    </div>)}
  </div>;
}

// Small section heading used to group the Edit & Format controls.
function SectionLabel({children,first}){
  return <div style={{fontSize:8,color:"#666",letterSpacing:1.5,fontWeight:700,marginTop:first?2:16,paddingTop:first?0:12,borderTop:first?"none":"1px solid #17171f"}}>{children}</div>;
}

// Parse CSV into {seriesNames, rows}. First column = label; every remaining column is
// a data series, so "Label,Revenue,Profit" yields a two-series dataset.
function parseCSV(text){
  const lines=text.trim().split("\n").filter(l=>l.trim());
  if(lines.length<2)return null;
  const header=lines[0].split(",").map(s=>s.trim().replace(/^"|"$/g,""));
  const seriesNames=header.length>1?header.slice(1).map(h=>h||"Value"):["Value"];
  const rows=lines.slice(1).map(line=>{
    const parts=line.split(",").map(p=>p.trim().replace(/^"|"$/g,""));
    const values=seriesNames.map((_,k)=>{const n=parseFloat(parts[k+1]);return isNaN(n)?0:n;});
    return {label:parts[0],values};
  }).filter(r=>r.label);
  if(!rows.length)return null;
  return {seriesNames,rows};
}

function validateData(rows){
  const issues=[];
  if(!rows||rows.length===0){issues.push("No data rows found.");return issues;}
  if(rows.length<2) issues.push("Only 1 data point — charts need at least 2.");
  if(rows.length>50) issues.push(`${rows.length} rows is a lot — consider trimming to ≤20 for clarity.`);
  const badVals=rows.filter(r=>valsOf(r).some(v=>v===""||v==null||isNaN(Number(v))));
  if(badVals.length>0) issues.push(`${badVals.length} row(s) have non-numeric values: ${badVals.slice(0,3).map(r=>r.label).join(", ")}${badVals.length>3?"…":""}`);
  const dupLabels=rows.map(r=>r.label).filter((v,i,a)=>a.indexOf(v)!==i);
  if(dupLabels.length>0) issues.push(`Duplicate labels: ${[...new Set(dupLabels)].join(", ")}`);
  return issues;
}

// Editable data grid for the Review stage: edit labels/values across one or more
// series, rename/add/remove series columns, and add/delete/reorder rows. Values are
// held as typed strings; the main component coerces to numbers on approve.
function EditableDataTable({series,rows,onChange}){
  const cols=(series&&series.length)?series:["Value"];
  const valAt=(r,k)=>{const v=r.values&&r.values[k]!=null?r.values[k]:(k===0&&r.value!=null?r.value:"");return v;};
  const withVals=r=>({...r,values:cols.map((_,k)=>valAt(r,k))});
  const setCell=(i,k,val)=>onChange(cols,rows.map((r,j)=>{if(j!==i)return r;const nr=withVals(r);nr.values=nr.values.slice();nr.values[k]=val;return nr;}));
  const setLabel=(i,val)=>onChange(cols,rows.map((r,j)=>j===i?{...r,label:val}:r));
  const setSeries=(k,val)=>{const ns=cols.slice();ns[k]=val;onChange(ns,rows);};
  const del=i=>onChange(cols,rows.filter((_,j)=>j!==i));
  const move=(i,d)=>{const j=i+d;if(j<0||j>=rows.length)return;const n=rows.slice();[n[i],n[j]]=[n[j],n[i]];onChange(cols,n);};
  const addRow=()=>onChange(cols,[...rows,{label:"",values:cols.map(()=>"")}]);
  const addCol=()=>onChange([...cols,"Series "+(cols.length+1)],rows.map(r=>{const nr=withVals(r);nr.values=[...nr.values,""];return nr;}));
  const delCol=k=>{if(cols.length<=1)return;onChange(cols.filter((_,c)=>c!==k),rows.map(r=>{const nr=withVals(r);nr.values=nr.values.filter((_,c)=>c!==k);return nr;}));};
  const cell={padding:"3px 6px",fontFamily:"monospace",verticalAlign:"middle"};
  const inp={width:"100%",background:"#070710",border:"1px solid #2c3446",borderRadius:5,color:"#e0e0e0",padding:"6px 7px",fontSize:13,fontFamily:"monospace",outline:"none",boxSizing:"border-box"};
  const icon=extra=>({background:"transparent",border:"1px solid #2a2a3e",borderRadius:5,color:"#888",cursor:"pointer",fontSize:11,fontFamily:"monospace",padding:"4px 7px",...extra});
  return <div style={{overflowX:"auto",marginTop:4}}>
    <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
      <thead><tr style={{borderBottom:"1px solid #2c3446"}}>
        <th style={{padding:"5px 6px",textAlign:"left",color:"#555",fontWeight:700,fontFamily:"monospace"}}>#</th>
        <th style={{padding:"5px 6px",textAlign:"left",color:"#555",fontWeight:700,fontFamily:"monospace"}}>LABEL</th>
        {cols.map((name,k)=><th key={k} style={{padding:"3px 6px"}}>
          <div style={{display:"flex",alignItems:"center",gap:3}}>
            <input value={name} onChange={e=>setSeries(k,e.target.value)} placeholder={"series"} style={{...inp,minWidth:70,padding:"4px 6px",fontSize:11,color:"#9aa4b2"}}/>
            {cols.length>1&&<button onClick={()=>delCol(k)} title="Delete series" style={icon({padding:"2px 5px",color:"#E84142",borderColor:"#E8414233"})}>✕</button>}
          </div>
        </th>)}
        <th></th>
      </tr></thead>
      <tbody>{rows.map((d,i)=><tr key={i} style={{borderBottom:"1px solid #161b26"}}>
        <td style={{...cell,color:"#444"}}>{i+1}</td>
        <td style={cell}><input value={d.label} onChange={e=>setLabel(i,e.target.value)} placeholder="label" style={inp}/></td>
        {cols.map((_,k)=><td key={k} style={{...cell,width:92}}><input value={valAt(d,k)} onChange={e=>setCell(i,k,e.target.value)} inputMode="decimal" placeholder="0" style={{...inp,textAlign:"right",color:"#F7931A"}}/></td>)}
        <td style={{...cell,whiteSpace:"nowrap",textAlign:"right"}}>
          <button onClick={()=>move(i,-1)} disabled={i===0} title="Move up" style={icon({opacity:i===0?0.3:1})}>↑</button>
          <button onClick={()=>move(i,1)} disabled={i===rows.length-1} title="Move down" style={icon({opacity:i===rows.length-1?0.3:1,marginLeft:4})}>↓</button>
          <button onClick={()=>del(i)} title="Delete row" style={icon({marginLeft:4,color:"#E84142",borderColor:"#E8414233"})}>✕</button>
        </td>
      </tr>)}</tbody>
    </table>
    <div style={{display:"flex",gap:8,marginTop:8,flexWrap:"wrap"}}>
      <button onClick={addRow} style={{padding:"7px 12px",borderRadius:6,background:"transparent",border:"1px dashed #2a2a3e",color:"#888",cursor:"pointer",fontSize:11,fontFamily:"monospace"}}>＋ Add row</button>
      <button onClick={addCol} style={{padding:"7px 12px",borderRadius:6,background:"transparent",border:"1px dashed #2a2a3e",color:"#888",cursor:"pointer",fontSize:11,fontFamily:"monospace"}}>＋ Add series</button>
    </div>
  </div>;
}

// ── Direct Anthropic API call (browser-side, no backend) ────────────────────────
const API_KEY_STORE="ghaf_anthropic_api_key";
const GEN_SYSTEM_PROMPT="You generate datasets for a charting tool. Given the user's description, produce real, accurate figures when you know them. Return: a concise human-readable `title`; `x_label` = what the row labels represent (e.g. \"Year\", \"Country\"); `series` = an array of 1–4 names for the value columns, each INCLUDING units (e.g. [\"GDP (Trillion USD)\"] for one measure, or [\"Revenue ($B)\",\"Profit ($B)\"], or [\"USA\",\"China\",\"India\"] when comparing several entities over time); use multiple series whenever the request implies more than one measure or entity, otherwise use exactly one. `chart_type` = the best fit (Line for time series/trends, Bar for category comparisons, Pie or Donut for parts of a whole — pie/donut only support one series). Up to 20 `rows`, each with a `label` and a `values` array of plain numbers aligned to `series` (no units, no thousands separators, no percent signs). If you use web search, base the figures on the sources you find and add a `source` object with `name` (e.g. \"World Bank\") and `url` for the primary source. Respond with a single JSON object and nothing else — no prose, no code fences.";
const GEN_SCHEMA={
  type:"object",
  properties:{
    title:{type:"string"},
    x_label:{type:"string"},
    series:{type:"array",items:{type:"string"}},
    chart_type:{type:"string",enum:["Bar","Line","Pie","Donut"]},
    rows:{type:"array",items:{type:"object",properties:{label:{type:"string"},values:{type:"array",items:{type:"number"}}},required:["label","values"],additionalProperties:false}},
  },
  required:["title","x_label","series","chart_type","rows"],
  additionalProperties:false,
};

function stripCodeFences(t){
  let s=(t||"").trim();
  if(s.startsWith("```")) s=s.replace(/^```[a-zA-Z]*\s*\n?/,"").replace(/\n?```\s*$/,"").trim();
  return s;
}
// Pull a JSON object out of model text that may be wrapped in prose/citations
// (web-search answers aren't pure JSON the way structured-output answers are).
function extractJsonObject(text){
  const s=stripCodeFences(text);
  try{ return JSON.parse(s); }catch(e){}
  const i=s.indexOf("{"), j=s.lastIndexOf("}");
  if(i>=0&&j>i){ try{ return JSON.parse(s.slice(i,j+1)); }catch(e){} }
  return null;
}

// Calls Claude directly from the browser. Returns {title,xLabel,yLabel,chartType,rows}
// (rows: [{label,value}]) or throws a friendly Error.
async function generateDatasetWithClaude(apiKey,description,opts){
  opts=opts||{};
  const model=opts.model||"claude-opus-4-7";
  const useWeb=!!opts.webSearch;
  const body={
    model,
    max_tokens:useWeb?3000:2048,
    // System prompt is stable across calls → cache it. (Short, so it may fall
    // under the model's minimum cacheable size and just not cache — harmless.)
    system:[{type:"text",text:GEN_SYSTEM_PROMPT,cache_control:{type:"ephemeral"}}],
    messages:[{role:"user",content:`Dataset to generate:\n\n${description}`}],
  };
  // Web search (server-side tool) yields current, sourced figures but isn't combined
  // with structured output; we parse the JSON object out of the answer text instead.
  if(useWeb) body.tools=[{type:"web_search_20250305",name:"web_search",max_uses:5}];
  else body.output_config={format:{type:"json_schema",schema:GEN_SCHEMA}};
  let resp;
  try{
    resp=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "x-api-key":apiKey,
        "anthropic-version":"2023-06-01",
        "anthropic-dangerous-direct-browser-access":"true",   // enables CORS for browser calls
      },
      body:JSON.stringify(body),
    });
  }catch(e){ throw new Error("Couldn't reach Anthropic — check your internet connection."); }

  if(!resp.ok){
    let msg="";
    try{ const j=await resp.json(); msg=(j&&j.error&&j.error.message)||""; }catch(e){}
    if(resp.status===401) throw new Error("Invalid API key (401) — check it and re-save.");
    if(resp.status===403) throw new Error("Key lacks permission (403)"+(msg?": "+msg:"")+".");
    if(resp.status===429) throw new Error("Rate limited (429) — wait a moment and retry.");
    if(resp.status===529) throw new Error("Anthropic is overloaded (529) — retry shortly.");
    if(resp.status>=500) throw new Error(`Anthropic server error (${resp.status}) — retry shortly.`);
    throw new Error(`Request failed (${resp.status})`+(msg?": "+msg:"")+".");
  }

  const data=await resp.json();
  if(data.stop_reason==="refusal") throw new Error("Claude declined this request — try rephrasing the dataset.");
  if(data.stop_reason==="max_tokens") throw new Error("Response was cut off — try a smaller / simpler dataset.");
  const text=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("").trim();
  if(!text) throw new Error("Claude returned an empty response — try again.");
  const obj=extractJsonObject(text);
  if(!obj) throw new Error("Couldn't parse Claude's response — try again.");
  // Accept both the multi-series shape (series + rows.values) and the legacy
  // single-value shape (y_label + rows.value).
  let seriesNames=Array.isArray(obj.series)&&obj.series.length?obj.series.map(s=>String(s).trim()||"Value"):(obj.y_label?[String(obj.y_label).trim()]:["Value"]);
  const rows=(obj.rows||[]).map(r=>{
    const label=String(r&&r.label!=null?r.label:"").trim();
    let vals=Array.isArray(r&&r.values)?r.values.map(v=>Number(v)):(r&&r.value!=null?[Number(r.value)]:[]);
    return {label,values:vals};
  }).filter(r=>r.label&&r.values.length&&!isNaN(r.values[0]));
  if(!rows.length) throw new Error("Claude returned no usable data rows — try rephrasing.");
  // Align column count to the widest row so series names and values stay in sync.
  const ncol=Math.max(seriesNames.length,...rows.map(r=>r.values.length));
  seriesNames=Array.from({length:ncol},(_,k)=>seriesNames[k]||("Series "+(k+1)));
  rows.forEach(r=>{r.values=Array.from({length:ncol},(_,k)=>{const n=Number(r.values[k]);return isNaN(n)?0:n;});});
  const types=["Bar","Line","Pie","Donut"];
  const src=obj.source&&obj.source.name?{name:String(obj.source.name).trim(),url:obj.source.url?String(obj.source.url).trim():""}:null;
  return {
    title:(obj.title||description).trim(),
    xLabel:(obj.x_label||"").trim(),
    yLabel:seriesNames.length===1?seriesNames[0]:"",
    series:seriesNames,
    chartType:types.includes(obj.chart_type)?obj.chart_type:(seriesNames.length>1?"Line":"Bar"),
    source:src,
    rows,
  };
}

// ── Main ──────────────────────────────────────────────────────────────────────
const STAGE_COLLECT="collect", STAGE_REVIEW="review", STAGE_CHART="chart";

function DataVizStudio11(){
  const [stage,setStage]=useState(STAGE_COLLECT);
  const [tab,setTab]=useState("quick");          // quick | csv | prompt
  const [csvText,setCsvText]=useState("");
  const [promptText,setPromptText]=useState("");
  const [promptCopied,setPromptCopied]=useState(false);
  const [csvError,setCsvError]=useState("");
  const [pending,setPending]=useState(null);
  const [validationIssues,setValidationIssues]=useState([]);
  const [savedCSV,setSavedCSV]=useState(false);
  const [chartData,setChartData]=useState(null);
  const [chartType,setChartType]=useState("Bar");
  const [animKey,setAnimKey]=useState(0);
  const [editTitle,setEditTitle]=useState("");
  const [axisX,setAxisX]=useState("");
  const [axisY,setAxisY]=useState("");
  const [incZero,setIncZero]=useState(false);
  const [gridTicks,setGridTicks]=useState(5);
  const [valueMode,setValueMode]=useState("auto");   // auto | on | off
  const [theme,setTheme]=useState("dark");           // dark | light
  const [palette,setPalette]=useState("Default");
  const [smooth,setSmooth]=useState(false);
  const [vGrid,setVGrid]=useState(false);              // vertical gridlines (line chart)
  const [orient,setOrient]=useState("vertical");       // bar orientation: vertical | horizontal
  const [barColor,setBarColor]=useState("palette");    // bar coloring: palette | sign
  const [barSort,setBarSort]=useState("none");         // bar sort: none | desc | asc
  const [yMin,setYMin]=useState("");
  const [yMax,setYMax]=useState("");
  const [maxSlices,setMaxSlices]=useState(0);          // 0 = show all slices (pie/donut)
  const [showLegend,setShowLegend]=useState(true);
  const [pieLabels,setPieLabels]=useState("percent");  // percent | value | both | none
  const [pieName,setPieName]=useState(false);          // show the category name on each slice
  const [aspect,setAspect]=useState("Auto");           // Auto | 1:1 | 4:3 | 16:9 | 9:16
  const [scale,setScale]=useState(3);                  // PNG/clipboard pixel multiplier
  const [speed,setSpeed]=useState(1);                  // build-up speed multiplier (live + GIF)
  const [easing,setEasing]=useState("Ease out");       // animation easing curve
  const [gifLoop,setGifLoop]=useState(true);           // loop the exported GIF forever
  const [gifHold,setGifHold]=useState(2000);           // ms pause on the finished GIF frame
  const [pngBusy,setPngBusy]=useState(false);
  const [svgBusy,setSvgBusy]=useState(false);
  const [copyState,setCopyState]=useState("");         // "" | done | error
  const [gifBusy,setGifBusy]=useState(false);
  const [gifPct,setGifPct]=useState(0);
  const [apiKey,setApiKey]=useState("");
  const [keySaved,setKeySaved]=useState(false);
  const [generating,setGenerating]=useState(false);
  const [genError,setGenError]=useState("");
  const [genModel,setGenModel]=useState("claude-opus-4-7");   // model for Ask Claude
  const [genWeb,setGenWeb]=useState(true);                    // use web search for current, sourced data

  useEffect(()=>{ try{const k=localStorage.getItem(API_KEY_STORE);if(k){setApiKey(k);setKeySaved(true);}}catch(e){} },[]);

  const saveKey=()=>{
    const k=(apiKey||"").trim();
    try{ if(k){localStorage.setItem(API_KEY_STORE,k);setKeySaved(true);setGenError("");} else {localStorage.removeItem(API_KEY_STORE);setKeySaved(false);} }
    catch(e){ setGenError("Couldn't save the key (localStorage blocked)."); }
  };
  const clearKey=()=>{ try{localStorage.removeItem(API_KEY_STORE);}catch(e){} setApiKey("");setKeySaved(false);setGenError(""); };

  const handleGenerate=async()=>{
    if(generating)return;
    const k=(apiKey||"").trim();
    if(!k){setGenError("Paste and save your Anthropic API key first.");return;}
    if(!promptText.trim()){setGenError("Describe the data you want first.");return;}
    setGenError(""); setGenerating(true);
    try{
      const res=await generateDatasetWithClaude(k,promptText.trim(),{model:genModel,webSearch:genWeb});
      const notes=genWeb?(res.source?`Generated by Claude with web search — sourced from ${res.source.name}. Verify before presenting.`:"Generated by Claude with web search — verify the numbers before presenting."):"Generated by Claude from model knowledge — verify the numbers before presenting.";
      goReview(res.title,res.series,res.rows,res.source||null,res.chartType,notes,res.xLabel,res.yLabel);
    }catch(e){ setGenError(e.message||"Generation failed."); }
    finally{ setGenerating(false); }
  };

  const goReview=(title,seriesNames,rows,source,suggestedType,notes="",xLabel="",yLabel="")=>{
    const ds=buildDataset(seriesNames,rows);
    const csvLines=rowsToCSV(ds.series,ds.rows);
    setCsvText(csvLines);
    setPending({title,series:ds.series,data:ds.rows,source,chartType:suggestedType||"Bar",notes,csvExport:csvLines,xLabel,yLabel});
    setValidationIssues(validateData(ds.rows)); setSavedCSV(false); setStage(STAGE_REVIEW);
  };

  const handleQuick=(key)=>{
    const ds=DATASETS[key];
    goReview(ds.title,["Value"],ds.data.map(d=>({label:d.label,values:[d.value]})),ds.source,ds.type,"Pre-loaded verified dataset.");
  };

  const handleCSV=()=>{
    const parsed=parseCSV(csvText);
    if(!parsed){setCsvError("Could not parse. First row must be a header like: Label,Value");return;}
    setCsvError("");
    goReview("Custom Data",parsed.seriesNames,parsed.rows,null,isMulti(parsed.seriesNames)?"Line":"Bar","");
  };

  const buildClaudePrompt=()=>{
    const base=promptText.trim()||"[describe your data here]";
    return `Please give me data for the following as a CSV with exactly two columns (Label and Value, plain numbers only, no units in the Value column, max 20 rows):\n\n${base}\n\nFormat your response as:\nLabel,Value\nrow1label,123\nrow2label,456\n...\n\nInclude nothing else — just the CSV.`;
  };

  const copyPrompt=()=>{
    navigator.clipboard.writeText(buildClaudePrompt()).then(()=>{
      setPromptCopied(true); setTimeout(()=>setPromptCopied(false),2500);
    });
  };

  // Live-edit the staged data (Review stage): keep typed strings, just re-derive the
  // CSV preview and validation so the user sees feedback as they type.
  const setPendingData=(seriesNames,rows)=>{
    const csvLines=rowsToCSV(seriesNames,rows);
    const numified=rows.map(r=>({label:String(r.label).trim(),values:valsOf(r).map(v=>Number(v))}));
    setPending(p=>p?{...p,series:seriesNames,data:rows,csvExport:csvLines}:p);
    setValidationIssues(validateData(numified));
  };

  const handleApprove=()=>{
    const ds=buildDataset(pending.series,pending.data);
    const data=ds.rows.filter(r=>r.label&&r.values.length&&!isNaN(r.values[0]));
    if(!data.length){alert("Add at least one row with a label and a number before graphing.");return;}
    const approved={...pending,series:ds.series,data,csvExport:rowsToCSV(ds.series,data)};
    setChartData(approved); setChartType(approved.chartType);
    setEditTitle(approved.title||""); setAxisX(approved.xLabel||""); setAxisY(approved.yLabel||"");
    setIncZero(false); setGridTicks(5); setValueMode("auto");
    setTheme("dark"); setPalette("Default"); setSmooth(false); setVGrid(false); setYMin(""); setYMax("");
    setOrient("vertical"); setBarColor("palette"); setBarSort("none");
    setMaxSlices(0); setShowLegend(true); setPieLabels("percent"); setPieName(false);
    setAspect("Auto"); setScale(3); setCopyState("");
    setSpeed(1); setEasing("Ease out"); setGifLoop(true); setGifHold(2000);
    setAnimKey(k=>k+1); setStage(STAGE_CHART);
  };

  const chartSeries=chartData?chartData.series:null;
  const chartOpts={xLabel:axisX,yLabel:axisY,includeZero:incZero,maxTicks:gridTicks,valueLabels:valueMode,
    theme,colors:PALETTES[palette]||COLORS,smooth,vGrid,yMin,yMax,pieLabels,pieName,speed,easing,series:chartSeries,orient,barColor};
  const exportFmt=()=>({title:editTitle,xLabel:axisX,yLabel:axisY,includeZero:incZero,maxTicks:gridTicks,
    valueLabels:valueMode,theme,palette,smooth,vGrid,yMin,yMax,maxSlices,showLegend,pieLabels,pieName,aspect,
    speed,easing,loop:gifLoop,hold:gifHold,series:chartSeries,orient,barColor,barSort});
  const fileBase=()=>((editTitle||(chartData&&chartData.title)||"chart").replace(/[^a-z0-9]/gi,"_").toLowerCase());

  const isPieType=chartType==="Pie"||chartType==="Donut";
  const isMultiSeries=!!(chartData&&isMulti(chartData.series)&&(chartType==="Line"||chartType==="Bar"));
  // Data actually drawn: pie/donut get top-N slices (rest → "Other"); others pass through
  // unchanged so the Bar/Line animation effect keeps a stable array reference.
  const displayData=useMemo(()=>{
    const d=chartData?chartData.data:[];
    if(isPieType) return limitSlices(d,maxSlices);
    if(chartType==="Bar") return sortRows(d,barSort);
    return d;
  },[chartData,isPieType,chartType,maxSlices,barSort]);
  const dims=chartDims(chartType,aspect);   // live-preview canvas size (matches export)
  const exportLayout=chartData?chartLayout(chartData,chartType,exportFmt()):null;   // for the export-size hint

  const handleSaveCSV=()=>{
    if(!pending&&!chartData)return;
    const src=pending||chartData;
    const blob=new Blob([src.csvExport],{type:"text/csv"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;
    a.download=(src.title||"data").replace(/[^a-z0-9]/gi,"_").toLowerCase()+".csv";
    a.click();URL.revokeObjectURL(url);setSavedCSV(true);
  };

  const downloadBlob=(blob,ext)=>{
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=fileBase()+"_"+chartType.toLowerCase()+"."+ext;
    a.click();URL.revokeObjectURL(url);
  };

  const saveGif=async()=>{
    if(gifBusy||!chartData)return;
    if(!window.GIF){alert("GIF encoder didn't load (needs internet). Try a hard-reload.");return;}
    setGifBusy(true);setGifPct(0);
    try{ downloadBlob(await exportChartGif(chartData,chartType,setGifPct,exportFmt(),scale),"gif"); }
    catch(e){alert(e.message||"GIF export failed.");}
    finally{setGifBusy(false);}
  };

  const savePng=async()=>{
    if(pngBusy||!chartData)return;
    setPngBusy(true);
    try{ downloadBlob(await exportChartPng(chartData,chartType,exportFmt(),scale),"png"); }
    catch(e){alert(e.message||"PNG export failed.");}
    finally{setPngBusy(false);}
  };

  const saveSvg=async()=>{
    if(svgBusy||!chartData)return;
    setSvgBusy(true);
    try{ downloadBlob(await exportChartSvg(chartData,chartType,exportFmt()),"svg"); }
    catch(e){alert(e.message||"SVG export failed.");}
    finally{setSvgBusy(false);}
  };

  const copyChart=async()=>{
    if(!chartData)return;
    try{ await copyChartToClipboard(chartData,chartType,exportFmt(),scale); setCopyState("done"); }
    catch(e){ setCopyState("error"); }
    setTimeout(()=>setCopyState(""),2500);
  };

  const reset=()=>{setStage(STAGE_COLLECT);setPending(null);setSavedCSV(false);setCsvError("");setValidationIssues([]);};

  // One-step-back navigation, used by the uniform back buttons (top-right + bottom-right).
  const goBack=()=>{ if(stage===STAGE_CHART)setStage(STAGE_REVIEW); else if(stage===STAGE_REVIEW)setStage(STAGE_COLLECT); };
  const BackBtn=({align})=>(
    <div style={{display:"flex",justifyContent:"flex-end",margin:align==="top"?"0 0 10px":"12px 0 0"}}>
      <button onClick={goBack} style={{padding:"7px 16px",borderRadius:6,background:"#1c2230",border:"1px solid #2c3446",color:"#cdd6e3",cursor:"pointer",fontSize:11,fontFamily:"monospace",fontWeight:700}}>← Back</button>
    </div>
  );

  const renderChart=(data)=>{
    if(!data?.length)return null;
    switch(chartType){
      case"Pie":   return <AnimatedPieChart data={data} animKey={animKey} opts={chartOpts} w={dims.w} h={dims.h}/>;
      case"Donut": return <AnimatedPieChart data={data} donut animKey={animKey} opts={chartOpts} w={dims.w} h={dims.h}/>;
      case"Bar":   return <AnimatedBarChart data={data} animKey={animKey} opts={chartOpts} w={dims.w} h={dims.h}/>;
      case"Line":  return <AnimatedLineChart data={data} animKey={animKey} opts={chartOpts} w={dims.w} h={dims.h}/>;
      default:     return <AnimatedBarChart data={data} animKey={animKey} opts={chartOpts} w={dims.w} h={dims.h}/>;
    }
  };

  const tabBtn=(t,label)=>({
    padding:"7px 14px",borderRadius:6,border:"1px solid",cursor:"pointer",fontSize:11,fontFamily:"monospace",fontWeight:700,
    borderColor:tab===t?"#F7931A":"#2a2a3e",background:tab===t?"#F7931A18":"transparent",color:tab===t?"#F7931A":"#555",
  });
  const chartBtn=(t)=>({
    padding:"6px 13px",borderRadius:6,border:"1px solid",cursor:"pointer",fontSize:11,fontFamily:"monospace",
    borderColor:chartType===t?"#627EEA":"#2c3446",background:chartType===t?"#627EEA18":"transparent",color:chartType===t?"#627EEA":"#555",
  });

  const Footnote=({source})=>source?(
    <div style={{marginTop:12,textAlign:"left",fontSize:10,color:"#555",fontStyle:"italic"}}>
      ¹ {source.url?<a href={source.url} target="_blank" rel="noopener noreferrer" style={{color:"#555",textDecoration:"underline",textDecorationColor:"#333"}}>{source.name}</a>:source.name}
    </div>
  ):null;

  return(
    <div style={{minHeight:"100vh",background:"#171c28",color:"#e0e0e0",fontFamily:"monospace",paddingBottom:40}}>
      <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Dancing+Script:wght@700&display=swap" rel="stylesheet"/>

      {/* Header */}
      <div style={{borderBottom:"1px solid #2c3446",padding:"13px 18px",display:"flex",alignItems:"center",gap:12,rowGap:8,flexWrap:"wrap",background:"#1c2230"}}>
        <div style={{width:28,height:28,background:"linear-gradient(135deg,#F7931A,#E84142)",borderRadius:7,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13}}>📊</div>
        <div style={{flex:1}}>
          <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:15,color:"#fff"}}>Graphics Hot AF</div>
          <div style={{fontSize:9,color:"#444",letterSpacing:1}}>CLASSROOMS & RESEARCH</div>
        </div>
        {/* Step pills */}
        <div style={{display:"flex",gap:4}}>
          {[[STAGE_COLLECT,"1 Collect"],[STAGE_REVIEW,"2 Review"],[STAGE_CHART,"3 Chart"]].map(([s,label])=>(
            <div key={s} style={{padding:"3px 9px",borderRadius:20,fontSize:9,fontWeight:700,
              background:stage===s?"#F7931A22":stage===STAGE_CHART&&s===STAGE_REVIEW?"#26A17B22":"transparent",
              border:`1px solid ${stage===s?"#F7931A":stage===STAGE_CHART&&s!==STAGE_COLLECT?"#26A17B44":"#2c3446"}`,
              color:stage===s?"#F7931A":stage===STAGE_CHART&&s!==STAGE_COLLECT?"#26A17B":"#333"}}>{label}
            </div>
          ))}
        </div>
        {/* Version banner — when the live site was last updated */}
        <div style={{textAlign:"right",lineHeight:1.1,marginLeft:4}}>
          <div style={{fontFamily:"'Dancing Script',cursive",fontWeight:700,fontSize:21,color:"#fff"}}>Hello World</div>
          <div style={{fontSize:8,color:"#d8dee8",letterSpacing:0.5,marginTop:1}}>Updated {BUILD_STAMP}</div>
        </div>
      </div>

      <div style={{maxWidth:820,margin:"0 auto",padding:"16px 14px",display:"flex",flexDirection:"column",gap:12}}>

        {/* ── STAGE 1 ── */}
        {stage===STAGE_COLLECT&&(
          <div style={{background:"#212838",border:"1px solid #2c3446",borderRadius:10,padding:16}}>
            <div style={{fontSize:9,color:"#444",letterSpacing:1,marginBottom:10}}>DATA SOURCE</div>
            <div style={{display:"flex",gap:6,marginBottom:16,flexWrap:"wrap"}}>
              <button style={tabBtn("quick","⚡ Examples")} onClick={()=>setTab("quick")}>⚡ Examples</button>
              <button style={tabBtn("csv","📄 Paste CSV")} onClick={()=>setTab("csv")}>📄 Paste CSV</button>
              <button style={tabBtn("prompt","💬 Ask Claude")} onClick={()=>setTab("prompt")}>💬 Ask Claude</button>
            </div>

            {tab==="quick"&&(
              <>
                <div style={{fontSize:9,color:"#444",letterSpacing:1,marginBottom:8}}>READY-TO-GRAPH DATASETS</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                  {QUICK_BUTTONS.map(({label,key})=>(
                    <button key={key} onClick={()=>handleQuick(key)} style={{padding:"9px 14px",borderRadius:8,border:"1px solid #2a2a3e",background:"#12121e",color:"#ccc",cursor:"pointer",fontSize:12,fontFamily:"monospace"}}>{label}</button>
                  ))}
                </div>
              </>
            )}

                  <span style={{fontSize:8,color:"#555",letterSpacing:1,fontWeight:700}}>ASPECT</span>
                  <select value={aspect} onChange={e=>{setAspect(e.target.value);setAnimKey(k=>k+1);}}
                    style={{background:"#070710",border:"1px solid #2a2a3e",borderRadius:6,color:"#e0e0e0",padding:"5px 7px",fontSize:12,fontFamily:"monospace",outline:"none"}}>
                    {Object.keys(ASPECTS).map(a=><option key={a} value={a}>{a}</option>)}
                  </select>
                </label>
                <label style={{display:"flex",alignItems:"center",gap:6}}>
                  <span style={{fontSize:8,color:"#555",letterSpacing:1,fontWeight:700}}>SIZE</span>
                  <select value={scale} onChange={e=>setScale(Number(e.target.value))}
                    style={{background:"#070710",border:"1px solid #2a2a3e",borderRadius:6,color:"#e0e0e0",padding:"5px 7px",fontSize:12,fontFamily:"monospace",outline:"none"}}>
                    {[1,2,3,4].map(n=><option key={n} value={n}>{n}×</option>)}
                  </select>
                </label>
                {exportLayout&&<span style={{fontSize:9,color:"#444"}}>PNG/copy ≈ {exportLayout.W*scale}×{exportLayout.H*scale}px · GIF capped at 2×</span>}
              </div>
              <SectionLabel>ANIMATION</SectionLabel>
              <div style={{display:"flex",gap:16,flexWrap:"wrap",alignItems:"center",marginTop:6}}>
                <label style={{display:"flex",alignItems:"center",gap:6}}>
                  <span style={{fontSize:8,color:"#555",letterSpacing:1,fontWeight:700}}>SPEED</span>
                  <input type="range" min={0.5} max={3} step={0.25} value={speed}
                    onChange={e=>setSpeed(Number(e.target.value))}
                    onMouseUp={()=>setAnimKey(k=>k+1)} onTouchEnd={()=>setAnimKey(k=>k+1)} onKeyUp={()=>setAnimKey(k=>k+1)}
                    style={{accentColor:"#F7931A",width:90}}/>
                  <span style={{fontSize:10,color:"#888",minWidth:30}}>{speed}×</span>
                </label>
                <label style={{display:"flex",alignItems:"center",gap:6}}>
                  <span style={{fontSize:8,color:"#555",letterSpacing:1,fontWeight:700}}>EASE</span>
                  <select value={easing} onChange={e=>{setEasing(e.target.value);setAnimKey(k=>k+1);}}
                    style={{background:"#070710",border:"1px solid #2a2a3e",borderRadius:6,color:"#e0e0e0",padding:"5px 7px",fontSize:12,fontFamily:"monospace",outline:"none"}}>
                    {Object.keys(EASINGS).map(e=><option key={e} value={e}>{e}</option>)}
                  </select>
                </label>
                <label style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer"}}>
                  <input type="checkbox" checked={gifLoop} onChange={e=>setGifLoop(e.target.checked)} style={{accentColor:"#F7931A"}}/>
                  <span style={{fontSize:8,color:"#555",letterSpacing:1,fontWeight:700}}>LOOP&nbsp;GIF</span>
                </label>
                <label style={{display:"flex",alignItems:"center",gap:6}}>
                  <span style={{fontSize:8,color:"#555",letterSpacing:1,fontWeight:700}}>GIF&nbsp;HOLD</span>
                  <select value={gifHold} onChange={e=>setGifHold(Number(e.target.value))}
                    style={{background:"#070710",border:"1px solid #2a2a3e",borderRadius:6,color:"#e0e0e0",padding:"5px 7px",fontSize:12,fontFamily:"monospace",outline:"none"}}>
                    <option value={0}>None</option><option value={1000}>1s</option><option value={2000}>2s</option><option value={3000}>3s</option>
                  </select>
                </label>
              </div>
              {(chartType==="Pie"||chartType==="Donut")&&<div style={{fontSize:10,color:"#555",marginTop:8}}>The legend of category names is always shown below. "On slice" adds numbers/% on the chart; tick "Name on slice" to label slices directly. Axis labels and gridlines don't apply to pie / donut.</div>}
            </div>

            <div style={{background:"#212838",border:"1px solid #2c3446",borderRadius:12,padding:"20px 14px",textAlign:"center"}}>
              <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:15,color:"#fff",marginBottom:3}}>{editTitle||chartData.title}</div>
              <div style={{fontSize:9,color:"#333",marginBottom:16,letterSpacing:1}}>{chartType.toUpperCase()} · {chartData.data.length} ITEMS</div>
              <div style={{display:"flex",justifyContent:"center"}}>{renderChart(displayData)}</div>
              {isMultiSeries
                ? <Legend data={chartData.series.map(n=>({label:n}))} colors={PALETTES[palette]||COLORS}/>
                : (isPieType||(chartType==="Bar"&&showLegend))&&displayData.length<=40&&<Legend data={displayData} colors={PALETTES[palette]||COLORS}/>}
              <div style={{display:"flex",gap:8,justifyContent:"center",marginTop:12,flexWrap:"wrap"}}>
                <button onClick={()=>setAnimKey(k=>k+1)} style={{padding:"6px 14px",background:"transparent",border:"1px solid #2c3446",color:"#555",borderRadius:6,cursor:"pointer",fontSize:10,fontFamily:"monospace"}}>↺ Replay</button>
                <button onClick={handleSaveCSV} style={{padding:"6px 14px",background:"transparent",border:`1px solid ${savedCSV?"#26A17B":"#2a2a3e"}`,color:savedCSV?"#26A17B":"#666",borderRadius:6,cursor:"pointer",fontSize:10,fontFamily:"monospace"}}>{savedCSV?"✓ CSV Saved":"⬇ Save CSV"}</button>
                <button onClick={copyChart} style={{padding:"6px 14px",background:"transparent",border:`1px solid ${copyState==="done"?"#26A17B":copyState==="error"?"#E84142":"#9B59B6"}`,color:copyState==="done"?"#26A17B":copyState==="error"?"#E84142":"#9B59B6",borderRadius:6,cursor:"pointer",fontSize:10,fontFamily:"monospace",fontWeight:700}}>{copyState==="done"?"✓ Copied":copyState==="error"?"✕ Not supported":"📋 Copy"}</button>
                <button onClick={savePng} disabled={pngBusy} style={{padding:"6px 14px",background:"transparent",border:"1px solid #627EEA",color:"#627EEA",borderRadius:6,cursor:pngBusy?"default":"pointer",fontSize:10,fontFamily:"monospace",fontWeight:700,opacity:pngBusy?0.6:1}}>{pngBusy?"⏳ …":"🖼 Save PNG"}</button>
                <button onClick={saveSvg} disabled={svgBusy} style={{padding:"6px 14px",background:"transparent",border:"1px solid #26A17B",color:"#26A17B",borderRadius:6,cursor:svgBusy?"default":"pointer",fontSize:10,fontFamily:"monospace",fontWeight:700,opacity:svgBusy?0.6:1}}>{svgBusy?"⏳ …":"◇ Save SVG"}</button>
                <button onClick={saveGif} disabled={gifBusy} style={{padding:"6px 14px",background:gifBusy?"#1a1000":"linear-gradient(135deg,#F7931A,#E84142)",border:"none",color:"#fff",borderRadius:6,cursor:gifBusy?"default":"pointer",fontSize:10,fontFamily:"monospace",fontWeight:700,opacity:gifBusy?0.8:1}}>{gifBusy?`⏳ Encoding ${gifPct}%`:"🎞 Save GIF (animated)"}</button>
                <button onClick={reset} style={{padding:"6px 14px",background:"transparent",border:"1px solid #2a2a3e",color:"#555",borderRadius:6,cursor:"pointer",fontSize:10,fontFamily:"monospace"}}>＋ New Chart</button>
              </div>
              <Footnote source={chartData.source}/>
            </div>
            <BackBtn align="bottom"/>
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<DataVizStudio11 />);
  </script>
</body>
</html>
